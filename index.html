<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#001e3c">
  <title>Ocean Treasure Hunt | 바다 속 보물찾기: 잠수부 키우기</title>
  <link rel="stylesheet" href="vendor/jua.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-database-compat.js"></script>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>

  <div id="topbar">
    <div class="pill" id="gold-pill">💰 <span id="gold">0</span></div>
    <div class="pill" id="pearl-pill">🦪 <span id="pearls">0</span></div>
    <div class="spacer"></div>
    <div id="conn-dot" class="dot"></div>
    <button class="icon-btn" id="music-btn" aria-label="music">🔊</button>
  </div>

  <section id="nickname-screen" class="screen hidden">
    <h1 data-i18n="appTitle"></h1>
    <h2 data-i18n="appSub"></h2>
    <p class="label" data-i18n="nicknameTitle"></p>
    <input id="nickname-input" maxlength="8" autocomplete="off" autocapitalize="off">
    <div id="nickname-error" class="error"></div>
    <button class="btn primary" id="nickname-btn" data-i18n="nicknameBtn"></button>
  </section>

  <section id="surface-screen" class="screen hidden">
    <div class="surface-top">
      <div id="greeting" class="greeting"></div>
      <div class="best"><span data-i18n="maxDepth"></span> <b id="best-depth">0</b>m · <span data-i18n="lifeBest"></span> <b id="life-depth">0</b>m</div>
      <div id="sub-rate" class="sub-rate hidden"></div>
    </div>
    <button class="btn dive-btn" id="dive-btn" data-i18n="dive"></button>
    <nav class="menu">
      <button class="btn small" id="shop-btn" data-i18n="shop"></button>
      <button class="btn small" id="codex-btn" data-i18n="codex"></button>
      <button class="btn small" id="rank-btn" data-i18n="rank"></button>
      <button class="btn small" id="prestige-btn" data-i18n="prestige"></button>
      <button class="btn small" id="stats-btn" data-i18n="stats"></button>
      <button class="btn small" id="howto-btn" data-i18n="howto"></button>
    </nav>
  </section>

  <section id="dive-screen" class="hidden">
    <div class="hud-top">
      <div class="depth-box"><span id="depth">0</span><small>m</small></div>
      <div id="zone-name" class="zone-name"></div>
      <div id="zone-hint" class="zone-hint"></div>
    </div>
    <div class="o2-wrap">
      <div class="o2-label"><span data-i18n="o2"></span><span><span id="o2-sec">30</span>s</span></div>
      <div class="o2-bar"><div id="o2-fill" class="o2-fill"></div><div id="safe-line" class="safe-line"></div></div>
      <div class="o2-sub"><span data-i18n="safeLine"></span> <span id="safe-sec">0</span>s</div>
    </div>
    <div class="bag-box">🎒 <span data-i18n="bag"></span> <b id="bag">0</b> G <span id="bag-items" class="bag-items"></span></div>
    <div id="float-layer"></div>
    <div class="hud-bottom">
      <div id="phase-text" class="phase-text"></div>
      <button class="btn ascend-btn" id="ascend-btn" data-i18n="ascend"></button>
    </div>
  </section>

  <div id="event-modal" class="modal hidden">
    <div class="card">
      <div id="event-emoji" class="big-emoji"></div>
      <h3 id="event-title"></h3>
      <div id="event-choices" class="choices"></div>
      <div id="event-result" class="event-result hidden"></div>
    </div>
  </div>

  <div id="result-modal" class="modal hidden">
    <div class="card">
      <div id="result-emoji" class="big-emoji"></div>
      <h3 id="result-title"></h3>
      <p id="result-body"></p>
      <div id="result-items" class="result-items"></div>
      <button class="btn primary" id="result-close" data-i18n="close"></button>
    </div>
  </div>

  <div id="shop-modal" class="modal hidden">
    <div class="card sheet">
      <h3 data-i18n="shop"></h3>
      <div id="shop-list" class="list"></div>
      <button class="btn ghost" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="prestige-modal" class="modal hidden">
    <div class="card">
      <div class="big-emoji">🌀</div>
      <h3 id="prestige-title"></h3>
      <p id="prestige-body"></p>
      <div class="row">
        <button class="btn ghost" data-close data-i18n="prestigeNo"></button>
        <button class="btn primary" id="prestige-yes" data-i18n="prestigeYes"></button>
      </div>
    </div>
  </div>

  <div id="codex-modal" class="modal hidden">
    <div class="card sheet">
      <h3 id="codex-title"></h3>
      <div id="codex-grid" class="codex-grid"></div>
      <button class="btn ghost" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="rank-modal" class="modal hidden">
    <div class="card sheet">
      <h3 data-i18n="rankTitle"></h3>
      <div id="rank-list" class="list"></div>
      <button class="btn ghost" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="stats-modal" class="modal hidden">
    <div class="card">
      <h3 data-i18n="statsTitle"></h3>
      <div id="stats-list" class="stats"></div>
      <button class="btn ghost" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="howto-modal" class="modal hidden">
    <div class="card">
      <h3 data-i18n="howto"></h3>
      <p id="howto-body" class="howto"></p>
      <button class="btn ghost" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
